<body class="peach-react">
<main class="flex justify-center px-6 py-12 max-sm:px-4 max-sm:py-6">
<article class="support-document flex w-full flex-col gap-6 rounded-3xl border border-separator-border bg-background-secondary-default p-8 max-sm:p-5" aria-labelledby="privacy-title">
<header class="flex flex-col gap-1"><img src="/assets/support-ui/logo.png" alt="" width="40" height="40" class="mb-4 size-10"><h1 id="privacy-title">统计偏好</h1></header>
<p id="privacy-collection">官网和演示站使用 Cloudflare Web Analytics 统计页面访问，并以自有统计分析按钮点击、可见区域和匿名访问动线。为关联两站内的同次访问，会使用共享于 peach.video 子域名的随机会话 Cookie；连续 30 分钟没有活动后失效。行为明细保留 30 天；页面参考截图随对应数据清理。汇总统计保留三个月。</p>
<p id="privacy-scope">自有统计不记录输入框内容、搜索词、影片标题、完整访问网址、IP 或完整浏览器标识，不录制页面与操作视频。关闭页面后的去向无法观察；离开位置依据会话结束前最后记录的位置判断。</p>
<div class="support-preference"><p id="preference" role="status" data-copy-ignore></p><div class="actions"><button id="analytics-off" type="button" data-copy-interact>停用自有统计</button><button id="analytics-on" type="button" data-copy-interact hidden>允许自有统计</button></div></div>
<nav class="support-top"><a id="privacy-home" href="/">返回官网</a><a id="privacy-demo" href="https://demo.peach.video/">打开演示站</a></nav>
</article></main>
<script type="module" src="/assets/behavior-privacy.js"></script>
</body></html>
