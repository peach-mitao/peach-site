name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:deploy
      - run: npx --no-install playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:browser
        if: runner.os == 'Linux'
      - run: npm run test:behavior
        if: runner.os == 'Linux'
