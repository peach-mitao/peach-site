<!doctype html><html lang="zh-CN" data-mode="dark" data-theme="kumo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>点击与动线 · Peach</title><link rel="stylesheet" href="/assets/behavior-kumo.css"><style>
@font-face{font-family:'Inter Variable';src:url(/assets/fonts/inter-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
:root{color-scheme:dark;--font-sans:'Inter Variable',ui-sans-serif,system-ui,sans-serif,'Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji';--page:var(--color-kumo-canvas);--ground:var(--color-kumo-base);--surface:var(--color-kumo-control);--ink:#d9d9d9;--strong:var(--text-color-kumo-default);--muted:var(--text-color-kumo-subtle);--hair:var(--color-kumo-line);--tungsten:#4693ff;--control-h:36px;--control-radius:8px;--surface-radius:8px}

.sidebar{position:fixed;inset:0 auto 0 0;width:256px;border-right:1px solid var(--hair);padding:0 16px;background:var(--page)}.brand{height:57px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;border-bottom:1px solid var(--hair);margin:0 -16px 24px;padding:0 20px}.brand-mark{display:block;width:24px;height:24px;flex-shrink:0;object-fit:contain}.sidebar-label{font-size:12px;line-height:16px;padding:0 12px;margin:0 0 8px;color:var(--muted)}.sidebar nav{display:grid;gap:4px}.sidebar a{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;color:var(--strong);text-decoration:none;font-size:13px;font-weight:500;line-height:15.2941px}.sidebar a:hover,.sidebar a[aria-current=page]{background:var(--surface)}.sidebar svg{width:16px;height:16px;flex-shrink:0}.sidebar-footer{position:absolute;bottom:20px;left:28px;font-size:12px;color:var(--muted)}
main{margin-left:256px;min-width:0}.breadcrumb{height:57px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:12px;padding:0 20px;color:var(--muted);font-size:13px;line-height:20px}.breadcrumb strong{font-weight:400;color:var(--ink)}header{min-height:56px;padding:12px 20px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:20px;line-height:28px;font-weight:600;margin:0}h2{font-size:12px;line-height:18px;letter-spacing:-.12px;font-weight:500;color:var(--muted);margin:0 0 16px}h3{font-size:14px;line-height:21px;font-weight:500;margin:0}p{color:var(--muted)}.header-actions{display:flex;gap:8px;align-items:center}.button-link{text-decoration:none}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0;padding:12px 16px;border-bottom:1px solid var(--hair)}label{color:var(--muted);font-size:13px;min-width:0}.filters label{display:flex;align-items:center}.filters label:has([name=days]){margin-left:auto;order:5}.select-label{display:block;margin-bottom:8px}.filters .select-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.select-island{display:block;min-width:0}.cf-select{min-width:124px;max-width:100%;letter-spacing:-.14px}.select-value{display:flex;align-items:center;gap:8px;min-width:0}.select-value svg{flex-shrink:0;color:var(--muted)}.select-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.version .cf-select{width:100%;min-width:0}
.tabs{display:flex;gap:24px;margin:0;padding:0 20px;border-bottom:1px solid var(--hair);overflow:auto}.tabs button{flex-shrink:0;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;min-height:44px;padding:0;color:var(--muted);font-size:14px;line-height:21px;letter-spacing:-.14px;white-space:nowrap}.tabs button:hover{color:var(--strong)}.tabs button[aria-selected=true]{color:var(--strong);border-bottom-color:var(--tungsten)}.content{padding:16px 24px 40px}.status{color:var(--muted);min-height:18px;font-size:12px;line-height:18px;letter-spacing:-.12px;margin:0 0 12px}.error{color:var(--text-color-kumo-danger)}.panel{background:var(--ground);padding:16px;box-shadow:0 0 0 1px var(--hair);border-radius:var(--surface-radius);margin-bottom:16px;min-width:0}.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.heat-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:16px;align-items:start}.scroll{overflow:auto;max-height:660px;overscroll-behavior:contain}
table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:14px;line-height:21px;letter-spacing:-.14px}th{font-weight:600;color:var(--strong)}th,td{height:45px;padding:12px;border-bottom:1px solid var(--hair)}td:first-child,th:first-child{padding-left:0}td:last-child,th:last-child{text-align:right}td{font-variant-numeric:tabular-nums}tbody tr:nth-child(even){background:var(--color-kumo-elevated)}tbody tr:hover{background:var(--surface)}td button{display:inline-flex;align-items:center;min-height:26px;background:var(--ground);border:0;border-radius:6px;box-shadow:0 0 0 1px var(--hair);padding:0 8px;color:var(--strong);font-size:12px}td button:hover{background:var(--color-kumo-tint)}button[aria-busy=true]{color:var(--muted);cursor:wait}
.empty{display:grid;place-content:center;text-align:center;min-height:200px;padding:24px}.empty p{font-size:13px;line-height:20px;margin:6px 0 0}.empty svg{margin:auto auto 12px;width:28px;height:28px;color:var(--muted)}.heat{position:relative;max-width:100%;margin:auto}.heat img{display:block;width:100%;height:auto}.heat svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#heat-image{max-height:660px;overflow:auto;border:1px solid var(--hair);border-radius:4px;background:var(--page);overscroll-behavior:contain}.version{border-top:1px solid var(--hair);padding-top:12px;margin-top:16px;font-size:13px;line-height:20px;color:var(--muted)}.version summary{cursor:pointer}.version summary:hover{color:var(--strong)}.version label{display:block;margin-top:12px}.version p{font-size:12px;line-height:18px;margin:8px 0 0}.timeline{padding-left:24px;font-size:14px;line-height:21px}.timeline li{padding:8px 0;overflow-wrap:anywhere}.flow{display:grid;gap:8px}.flow .panel{display:flex;justify-content:space-between;gap:16px;padding:12px;margin:0;background:var(--surface);font-size:14px;line-height:21px;overflow-wrap:anywhere}.flow strong{white-space:nowrap;font-weight:500}.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.funnel>div{border-left:2px solid var(--tungsten);padding-left:12px}.funnel strong{display:block;font-size:24px;line-height:32px;font-weight:600;font-variant-numeric:tabular-nums}.funnel span{color:var(--muted);font-size:13px;line-height:20px}
@media(max-width:1150px){.heat-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:800px){.sidebar{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--hair);padding:0 16px}.brand{height:48px;border:0;margin:0;padding:0}.sidebar nav,.sidebar-label,.sidebar-footer{display:none}main{margin:0}.breadcrumb{height:40px;padding:0 16px}header{padding:12px 16px;align-items:start;flex-wrap:wrap}.filters{padding:12px 16px;gap:8px}.filters label{flex:1 1 140px;display:block}.filters label:has([name=days]){margin-left:0}.cf-select{width:100%;min-width:0}.tabs{padding:0 16px;gap:24px}.content{padding:16px 16px 32px}.analytics-grid{grid-template-columns:1fr;gap:0}.heat-grid{gap:0}.panel{padding:16px}.funnel{grid-template-columns:1fr 1fr}.header-actions{flex-wrap:wrap}#heat-image{max-height:520px}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="app-root">
<aside class="sidebar" aria-label="Peach 分析导航"><div class="brand"><img class="brand-mark" src="/assets/peach-logo-192.webp" alt="" width="24" height="24">Peach 分析</div><p class="sidebar-label">分析</p><nav><a href="/analytics/native" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 19h16M7 15V9m5 6V5m5 10v-4"/></svg>CF 原生面板 ↗</a><a href="/analytics/" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 3 14 9-7 1-3 7Z"/></svg>点击与动线</a></nav><span class="sidebar-footer">Peach · Cloudflare</span></aside>
<main><div class="breadcrumb"><span>分析</span><span aria-hidden="true">›</span><strong>点击与动线</strong></div>
<header><h1>点击与动线</h1><nav class="header-actions"><a class="button-link" href="/analytics/native" target="_blank" rel="noopener">CF 原生面板 ↗</a><a class="button-link" href="/privacy/analytics">统计偏好</a></nav></header>
<form class="filters" id="filters">
<label>网站<select name="site"><option value="site">官网</option><option value="demo">演示站</option></select></label>
<label>时间<select name="days"><option value="1">最近 24 小时</option><option value="7" selected>最近 7 天</option><option value="30">最近 30 天</option><option value="365">最近一年</option><option value="3650">最近十年</option></select></label>
<label>设备<select name="viewport"><option value="">全部设备</option><option value="desktop">桌面</option><option value="tablet">平板</option><option value="mobile">手机</option></select></label>
<label>页面<select name="page"><option value="">全部页面</option></select></label>
<label>语言<select name="lang"><option value="">全部语言</option><option value="zh-CN">中文</option><option value="en">English</option></select></label>
</form>
<div class="tabs" role="tablist" aria-label="分析视图"><button role="tab" aria-selected="true" aria-controls="heatmap" id="tab-heatmap">点击热力图</button><button role="tab" aria-selected="false" aria-controls="journey" id="tab-journey">访问动线</button><button role="tab" aria-selected="false" aria-controls="visits" id="tab-visits">会话明细</button></div>
<div class="content"><p class="status" role="status" id="status"></p><p class="status">汇总结果最多复用 30 分钟，更新时间以生成时刻为准；会话明细按需查询。</p>
<section role="tabpanel" id="heatmap" aria-labelledby="tab-heatmap"><div class="heat-grid"><div class="panel"><h2>点击分布</h2><div id="heat-status" class="status"></div><div id="heat-image"></div><details class="version"><summary>页面版本</summary><label>已保存的页面截图<select id="layout"><option value="">暂无页面截图</option></select></label><p>默认显示最新保存的截图。查看历史版本时，点击位置会对应当时的页面。</p></details></div><div class="panel"><h2>区域与按钮</h2><div id="targets" class="scroll"></div></div></div></section>
<section role="tabpanel" id="journey" aria-labelledby="tab-journey" hidden><div class="panel"><h2>官网 → 演示 → 下载</h2><div id="funnel" class="funnel"></div></div><div class="panel"><h2>两站之间的访问路径</h2><div id="paths" class="flow"></div></div><div class="analytics-grid"><div class="panel"><h2>首次入口来源</h2><div id="sources" class="scroll"></div></div><div class="panel"><h2>最后停留</h2><div id="exits" class="scroll"></div></div></div></section>
<section role="tabpanel" id="visits" aria-labelledby="tab-visits" hidden><div class="analytics-grid"><div class="panel"><h2>最近会话</h2><div id="sessions" class="scroll"></div></div><div class="panel"><h2>会话时间线</h2><div id="session-detail" class="scroll"></div><button id="session-more" data-copy-interact hidden>加载更多记录</button></div></div></section>
</div></main></div><script type="module" src="/assets/behavior-dashboard.js"></script></body></html>
