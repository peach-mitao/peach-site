<header class="flex flex-col gap-1"><img src="/assets/support-ui/logo.png" alt="" width="40" height="40" class="mb-4 size-10"><h1 id="privacy-title">统计偏好</h1></header>
<p id="privacy-collection">Peach 官网和演示站使用 Cloudflare Web Analytics 统计页面访问，分析按钮点击、可见区域和匿名访问动线。为关联两站内的同次访问，会使用共享于 peach.video 子域名的随机会话 Cookie；连续 30 分钟没有活动后失效。匿名行为明细和对应页面参考截图长期保留。汇总统计保留三个月。</p>
<p id="privacy-scope">统计不记录输入框内容、搜索词、影片标题、完整访问网址、IP 或完整浏览器标识，不录制页面与操作视频。关闭页面后的去向无法观察；离开位置依据会话结束前最后记录的位置判断。</p>
<div id="privacy-controls" class="boardui-root"><!--PRIVACY_CONTROLS--></div>
</article></main>
